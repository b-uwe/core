rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules:
    status: exempt
    comment: Integration uses standard Home Assistant patterns, no duplicate code to extract
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Integration does not subscribe to external events
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: Integration manages only local data with no external devices or services that could become unavailable
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Integration manages local favorites data, no discovery functionality
  discovery:
    status: exempt
    comment: Integration manages local favorites data, no discovery functionality
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: No dynamic devices to add/remove, favorites are managed via services
  entity-category:
    status: exempt
    comment: Favorite entities are not diagnostic/config - they represent user's main content
  entity-device-class:
    status: exempt
    comment: Sensors represent favorites without specific device class
  entity-disabled-by-default:
    status: exempt
    comment: All favorite entities should be enabled by default for user visibility
  entity-translations: done
  exception-translations:
    status: exempt
    comment: Integration uses standard Home Assistant exceptions, no custom translations needed
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: No configuration parameters to reconfigure after initial setup
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: No external devices to become stale, all data is locally managed

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
